[workspace]
resolver = "3"
members = [
    "apps/codex-tray-kde",
    "apps/codex-tray-windows",
    "crates/codex-usage-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
codex-usage-core = { path = "crates/codex-usage-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
